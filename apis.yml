name: Keyboardio
description: >-
  Keyboardio is a hardware company that designs and sells premium ergonomic
  mechanical keyboards, including the sculpted hardwood Model 100, the ultra-
  portable Atreus, and the upcoming Preonic. Its keyboards run fully open-source,
  reprogrammable firmware (Kaleidoscope) configured through the cross-platform
  Chrysalis GUI, both developed in the open on GitHub. Keyboardio sells direct
  through a Shopify storefront at shop.keyboard.io; customer login and account
  management use Shopify Customer Accounts (OpenID Connect / OAuth 2.0) bound to
  the keyboard.io domain. Keyboardio has no first-party public HTTP API — this
  profile captures the real developer, open-source, and identity surfaces the
  company publishes.
